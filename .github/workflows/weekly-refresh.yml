name: Weekly job data refresh

on:
  schedule:
    # 02:00 UTC every Monday. GitHub may delay scheduled workflows during busy periods.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      pages_per_role:
        description: "Adzuna pages to request for each target role"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Adzuna jobs
        if: ${{ secrets.ADZUNA_APP_ID != '' && secrets.ADZUNA_APP_KEY != '' }}
        run: |
          PAGES_PER_ROLE="${{ inputs.pages_per_role || '1' }}"
          python scripts/import_jobs.py --source adzuna --pages-per-role "$PAGES_PER_ROLE"

      - name: Explain skipped refresh
        if: ${{ secrets.ADZUNA_APP_ID == '' || secrets.ADZUNA_APP_KEY == '' }}
        run: |
          echo "Skipped: add ADZUNA_APP_ID and ADZUNA_APP_KEY as repository secrets to enable weekly collection."

      - name: Upload refreshed SQLite database
        if: ${{ secrets.ADZUNA_APP_ID != '' && secrets.ADZUNA_APP_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jobintel-database-${{ github.run_number }}
          path: data/jobintel.db
          if-no-files-found: error
          retention-days: 14
